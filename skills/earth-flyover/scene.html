<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <style>
    html,body,#viewDiv{margin:0;padding:0;height:100%;width:100%;background:#000}
    /* Sizes use clamp(min, vw-scaled, max) so the same markup reads well whether
       rendered 16:9 landscape (wide, shorter) or 9:16 portrait (narrow, taller) —
       vw ties text size to frame width, the dimension that most differs between them. */
    #hud{
      position:absolute; left:3.2vw; bottom:3.2vw; z-index:10;
      max-width:min(78vw, 640px); display:none;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
      color:#fff; text-shadow:0 1px 4px rgba(0,0,0,0.9), 0 0 2px rgba(0,0,0,0.9);
    }
    #hud .hud-card{
      background:linear-gradient(180deg, rgba(10,14,10,0.62), rgba(10,14,10,0.74));
      border-left:0.5vw solid #ffd400;
      border-radius:6px; padding:2vw 2.6vw;
    }
    #hud .hud-hole{ font-size:clamp(20px, 4.3vw, 40px); font-weight:800; letter-spacing:0.5px; line-height:1.05; }
    #hud .hud-meta{ font-size:clamp(13px, 2.6vw, 22px); font-weight:600; opacity:0.92; margin-top:2px; letter-spacing:0.5px; }
    #hud .hud-note{ font-size:clamp(11px, 2vw, 17px); font-weight:400; opacity:0.88; margin-top:8px; line-height:1.4; white-space:pre-line; }
    #hud .hud-course{ font-size:clamp(16px, 3.2vw, 28px); font-weight:800; }
    #hud .hud-course-meta{ font-size:clamp(11px, 2.2vw, 18px); font-weight:600; opacity:0.9; margin-top:2px; }
  </style>
  <link rel="stylesheet" href="https://js.arcgis.com/4.31/esri/themes/dark/main.css" />
  <script src="https://js.arcgis.com/4.31/"></script>
</head>
<body>
  <div id="viewDiv"></div>
  <div id="hud"><div class="hud-card" id="hud-card"></div></div>
  <script>
    // Exposes to Playwright:
    //   window.__viewReady    -> resolves when the globe is ready (or rejects with error)
    //   window.setCamera(cam) -> sets camera, resolves once tiles settle
    //   window.setHoleInfo(x) / window.setCourseInfo(x) / window.hideHud()
    //                          -> update/hide the burned-in text HUD (a DOM overlay,
    //                             not part of the 3D scene — capture with Playwright's
    //                             page.screenshot(), NOT view.takeScreenshot(), so it composites in)
    window.__viewReady = new Promise((resolve, reject) => {
      require([
        "esri/Map",
        "esri/views/SceneView",
        "esri/layers/TileLayer",
        "esri/geometry/Point"
      ], (Map, SceneView, TileLayer, Point) => {
        window.__Point = Point;
        try {
          // Public Esri World Imagery (satellite) draped on real world elevation.
          // Swap this TileLayer/basemap for your keyed premium content later.
          const imagery = new TileLayer({
            url: "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer"
          });

          const map = new Map({
            basemap: { baseLayers: [imagery] },
            ground: "world-elevation"
          });

          const view = new SceneView({
            container: "viewDiv",
            map: map,
            qualityProfile: "high",
            environment: {
              atmosphereEnabled: true,
              atmosphere: { quality: "high" },
              starsEnabled: true,
              lighting: { directShadowsEnabled: false, date: new Date("2026-06-21T18:00:00Z") }
            },
            ui: { components: [] }
          });

          window.__view = view;
          view.when(() => resolve(true), (e) => reject(e && e.message ? e.message : String(e)));
        } catch (e) {
          reject(String(e));
        }
      });
    });

    // Set the camera and wait briefly for tiles to settle (bounded — with overlay
    // GraphicsLayers present, view.updating can stay true well past when the frame
    // already looks correct, so this is a soft check with a hard cap, not a real wait-until-idle).
    // minStable requires N *consecutive* not-updating reads, not just one -- a single
    // read can catch a momentary flicker between "coarse tile shown" and "full-res tile
    // request starts", which looks fine for cached-nearby frames but leaves a visibly
    // blurry frame when nothing nearby is cached yet (e.g. frame 0 of a render).
    window.setCamera = function (cam, maxWaitMs, minStable) {
      const v = window.__view;
      v.camera = cam; // { position:{longitude,latitude,z}, heading, tilt }
      const cap = maxWaitMs || 900;
      const need = minStable || 1;
      return new Promise((resolve) => {
        const start = Date.now();
        let stableCount = 0;
        const timer = setInterval(() => {
          if (!v.updating) stableCount++; else stableCount = 0;
          if (stableCount >= need || Date.now() - start > cap) {
            clearInterval(timer);
            resolve();
          }
        }, 90);
      });
    };

    window.shoot = async function () {
      const s = await window.__view.takeScreenshot({ format: "png" });
      return s.dataUrl;
    };

    function esc(s) { return String(s ?? "").replace(/[&<>]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

    // Burn in a per-hole info card: hole number, par, distance, tee-sign note text.
    window.setHoleInfo = function ({ hole, par, distance, note }) {
      document.getElementById("hud-card").innerHTML =
        `<div class="hud-hole">HOLE ${esc(hole)}</div>` +
        `<div class="hud-meta">PAR ${esc(par)} &nbsp;&middot;&nbsp; ${esc(distance)}</div>` +
        (note ? `<div class="hud-note">${esc(note)}</div>` : "");
      document.getElementById("hud").style.display = "block";
    };

    // Burn in a course-level title card (used at the start of an "establish" flyover).
    window.setCourseInfo = function ({ name, par, length, holes }) {
      document.getElementById("hud-card").innerHTML =
        `<div class="hud-course">${esc(name)}</div>` +
        `<div class="hud-course-meta">${esc(holes)} HOLES &nbsp;&middot;&nbsp; PAR ${esc(par)} &nbsp;&middot;&nbsp; ${esc(length)}</div>`;
      document.getElementById("hud").style.display = "block";
    };

    window.hideHud = function () { document.getElementById("hud").style.display = "none"; };

    // Sample terrain elevation (metres above sea level) at a coordinate.
    window.groundZ = async function (lat, lng) {
      try {
        const pt = new window.__Point({ longitude: lng, latitude: lat, z: 0, spatialReference: { wkid: 4326 } });
        const r = await window.__view.map.ground.queryElevation(pt);
        return r.geometry.z;
      } catch (e) {
        return 0;
      }
    };

    // Draw caddie-book overlays (flight paths, OB, tees, baskets, hole #s, amenities)
    // as terrain-draped 3D graphics. payload arrays hold [lng,lat] coords.
    window.addOverlays = function (p) {
      return new Promise((resolve) => {
        require(["esri/Graphic", "esri/layers/GraphicsLayer"], (Graphic, GraphicsLayer) => {
          const v = window.__view;
          const onGround = { mode: "on-the-ground" };
          const floating = { mode: "relative-to-ground", offset: 16 };
          const lineLayer = new GraphicsLayer({ elevationInfo: onGround });
          const pointLayer = new GraphicsLayer({ elevationInfo: onGround });
          const labelLayer = new GraphicsLayer({ elevationInfo: floating });
          const G = (geometry, symbol) => new Graphic({ geometry, symbol });

          (p.flightPaths || []).forEach((path) =>
            lineLayer.add(G({ type: "polyline", paths: [path] },
              { type: "simple-line", color: [255, 215, 0, 0.9], width: 2.5 })));

          (p.ob || []).forEach((path) =>
            lineLayer.add(G({ type: "polyline", paths: [path] },
              { type: "simple-line", color: [255, 45, 45, 0.95], width: 2, style: "short-dash" })));

          (p.tees || []).forEach((t) =>
            pointLayer.add(G({ type: "point", longitude: t[0], latitude: t[1] },
              { type: "simple-marker", style: "square", color: [255, 255, 255, 0.95], size: 6,
                outline: { color: [0, 0, 0, 0.6], width: 0.5 } })));

          const AC = {
            restroom: [70, 130, 255], wc: [70, 130, 255],
            water: [0, 190, 190], "water-point": [0, 190, 190],
            medical: [220, 40, 40], "medical-services": [220, 40, 40], "first-aid": [220, 40, 40],
            parking: [150, 150, 150], info: [240, 200, 20], "info-board-location": [240, 200, 20]
          };
          (p.amenities || []).forEach((a) =>
            pointLayer.add(G({ type: "point", longitude: a.lng, latitude: a.lat },
              { type: "simple-marker", style: "diamond", color: AC[a.type] || [200, 120, 255], size: 8,
                outline: { color: [255, 255, 255, 0.85], width: 0.8 } })));

          (p.baskets || []).forEach((b) => {
            pointLayer.add(G({ type: "point", longitude: b.lng, latitude: b.lat },
              { type: "simple-marker", style: "circle", color: [255, 120, 0, 1], size: 9,
                outline: { color: [60, 25, 0], width: 1 } }));
            labelLayer.add(G({ type: "point", longitude: b.lng, latitude: b.lat },
              { type: "text", text: String(b.hole), color: [255, 255, 255],
                haloColor: [0, 0, 0], haloSize: 1.6, font: { size: 13, weight: "bold" } }));
          });

          // Location pins (optional `markers` array in the course JSON: {lat, lng, label, primary}):
          // geo-anchored markers drawn terrain-draped so they stay registered to the ground
          // through a full orbit-to-course descent. `primary` is the highlighted pin (opaque chip);
          // the rest render as secondary rings.
          (p.markers || []).forEach((m) => {
            const teal = [24, 201, 182];
            pointLayer.add(G({ type: "point", longitude: m.lng, latitude: m.lat },
              m.primary
                ? { type: "simple-marker", style: "circle", color: [255, 255, 255, 1], size: 20,
                    outline: { color: [11, 18, 32, 1], width: 4 } }
                : { type: "simple-marker", style: "circle", color: [11, 18, 32, 0.30], size: 26,
                    outline: { color: teal.concat(1), width: 5 } }));
            if (m.label) labelLayer.add(G({ type: "point", longitude: m.lng, latitude: m.lat },
              m.primary
                ? { type: "text", text: m.label, color: [11, 18, 32],
                    haloColor: [255, 255, 255], haloSize: 7,
                    font: { size: 30, weight: "bold" }, yoffset: 26 }
                : { type: "text", text: m.label, color: [235, 245, 252],
                    haloColor: [11, 18, 32], haloSize: 2.2,
                    font: { size: 13, weight: "bold" }, yoffset: 14 }));
          });

          v.map.addMany([lineLayer, pointLayer, labelLayer]);
          setTimeout(() => resolve({
            lines: lineLayer.graphics.length,
            points: pointLayer.graphics.length,
            labels: labelLayer.graphics.length
          }), 400);
        });
      });
    };
  </script>
</body>
</html>
